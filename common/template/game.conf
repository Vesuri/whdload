# games/<Game>/game.conf: plain shell assignments, read by every common/ script and by
# `make list`. $VARIANT is set when this is read, so a value may depend on it (a case
# statement on $VARIANT). The caller's environment beats every value here.

# The game, for listings and window titles.
TITLE="@TITLE@"
# The original slave's maintainer (the upstream repository's, else the authors its ReadMe or
# slave names), and where its source came from: a repository and commit, or "none".
AUTHOR=""
UPSTREAM=""

# The slaves this game ships, by base name; the first is the default VARIANT.
VARIANTS="@GAME@"
# Defaults, per variant: GAME_DIR=$VARIANT (the installed drawer under tmp/game/),
# SLAVE_FILE=$VARIANT.Slave, SOURCE=src/$VARIANT.s.
#GAME_DIR=
#SLAVE_FILE=
#SOURCE=

# Build (common/build.sh): vasm flags, extra include directories under the game, defines.
#VASM_FLAGS="-m68000 -x -devpac -Fhunkexe -nosym"
#INCLUDES=""
#DEFINES=""
#DEFINES_verify="-DVERIFY=1"

# Run (common/run.sh): Kickstart files the slave needs in DEVS:Kickstarts (with their .RTB),
# e.g. kick34005.A500 for kick13 slaves, kick40068.A1200 for kick31; none for direct slaves.
KICKS="kick34005.A500"
# The default machine (an AmigaXDev named setup, or custom) and the machines it is tested on.
SETUP=a500
SETUPS="a500"
# WHDLoad options every boot gets; WHD_ARGS adds to them.
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
#JOY0=mouse
#JOY1=keyboard
#NTSC=1
