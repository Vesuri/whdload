# Powerdrome: common/template/game.conf describes every value.
TITLE="Powerdrome"
# Galahad/Fairlight's v1.0 slave (22.05.2003) shipped without source; src/original/ is its
# byte-identical reconstruction (make build BUILD=original checks it against the installed one).
AUTHOR="Galahad/Fairlight"
UPSTREAM="none"

VARIANTS="Powerdrome"
SOURCE=src/Powerdrome.s

# Builds (game.sh game_build generates tmp/build/mouse-sine.i first): release, verify,
# coverage (the native input replays), original (the reconstruction, compared with the
# installed slave) and original_verify (its input-only reference). VASM_EXTRA adds defines
# (docs/development.md).
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
INCLUDES="src/include"
DEFINES_coverage="-DVERIFY=1 -DCOVERAGE_INPUT=1"

KICKS="kick34005.A500"
# The machine every capture in docs/ was made on: 68000, 512 KB Chip and 1.5 MB slow memory.
# The release matrix (tools/release_matrix.py) gives each of its machines in the environment.
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=512
SLOW_KB=1536
FAST_KB=0
SETUPS="custom a1200 a1200-fast a1200-030 a1200-040 a1200-060"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
