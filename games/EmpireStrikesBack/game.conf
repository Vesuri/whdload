# Empire Strikes Back: common/template/game.conf describes every value.
TITLE="Empire Strikes Back"
# Codetapper's v1.2 slave (20.03.2003) shipped without source; src/EmpireStrikesBack.s
# reconstructs it byte for byte (docs/development.md).
AUTHOR="Codetapper"
UPSTREAM="none"

# One slave. The drawer is the Retroplay one (EmpireStrikesBack_v1.2_1235.lha).
VARIANTS="EmpireStrikesBack"
# -devpac (no optimisation): the slave sizes its branches. It has no relocations.
VASM_FLAGS="-m68000 -x -devpac -Fhunkexe -nosym"
# Development builds of the enhanced framerate (docs/development.md): "check" replays
# every game state, the exact frames only, and compares each with the tick's own drawing;
# "timing" times each op type; "direct" runs every tick as the default (a baseline).
DEFINES_check="-DVERIFY=1 -DSM_ALLSTATES=1"
DEFINES_timing="-DSM_TIMING=1"
DEFINES_direct="-DSM_DIRECT=1"

# A direct slave: no Kickstart, 512 KB chip memory.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
