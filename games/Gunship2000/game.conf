# Gunship 2000: common/template/game.conf describes every value.
TITLE="Gunship 2000"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves G/Gunship2000/usr 6046174e"

# Three slaves, one source each, each run in its own Retroplay drawer: the floppy ECS
# release (SPS 0808, kick13), the floppy AGA release (SPS 0371, kick31) and the CD32
# release (kick31, with fakepad.s emulating the pad from joystick and keys).
VARIANTS="Gunship2000ECS Gunship2000AGA Gunship2000CD32"
SOURCE="src/${VARIANT}HD.s"
# lvo/lowlevel.i (fakepad.s) by its NDK name.
INCLUDES="src/include"
# vasm's default optimisations (no -devpac) stand in for Barfly's BOPT O+; -pic forbids
# relocations, as in the shipped slaves.
VASM_FLAGS="-m68000 -pic -x -Fhunkexe -nosym"
case "$VARIANT" in
  Gunship2000ECS) GAME_DIR=Gunship2000 SLAVE_FILE=Gunship2000.slave KICKS="kick34005.A500" ;;
  Gunship2000AGA) GAME_DIR=Gunship2000AGA SLAVE_FILE=Gunship2000AGA.slave KICKS="kick40068.A1200" ;;
  Gunship2000CD32) GAME_DIR=Gunship2000CD32 SLAVE_FILE=Gunship2000CD32.slave KICKS="kick40068.A1200" ;;
esac

# ECS: 1 MB BaseMem (chip) + 1 MB ExpMem + the 256 KB Kickstart, more than any named 68000
# machine has, so an A500 with 1 MB chip and 2 MB fast. AGA: 1 MB + 1 MB + the 512 KB
# Kickstart; CD32: $1FF000 BaseMem and no ExpMem + the Kickstart. Both need fast RAM beside
# the A1200's 2 MB chip.
case "$VARIANT" in
  Gunship2000ECS)
    SETUP=custom
    AMIGA_MODEL=A500
    CPU=68000
    CHIP_KB=1024
    FAST_KB=2048
    SETUPS="custom a1200-fast"
    ;;
  *)
    SETUP=a1200-fast
    SETUPS="a1200-fast"
    ;;
esac
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
