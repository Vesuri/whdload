# Legends of Valour: common/template/game.conf describes every value.
TITLE="Legends of Valour"
# CFou!'s v1.0 slave (06.02.2005); src/LegendsOfValourHD.s reconstructs it from the binary
# on WHDLoad 20.0's kick13 example (docs/profiling.md §2).
AUTHOR="CFou!"
UPSTREAM="none"

# One slave, run as the installed LegendsOfValour.Slave. The release build always enables
# the rendering patches; developer exposes them as CUSTOM2 switches, and VERIFY (which
# implies DEVELOPER in the source) adds the input tape and the other instruments.
VARIANTS="LegendsOfValour"
SOURCE=src/LegendsOfValourHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"

KICKS="kick34005.A500"
# Interactive play: a 68000 A500 with 1 MB chip and 8 MB fast RAM. Captures choose their
# own machines (docs/profiling.md §3); the A500-equivalent one is a500-1.5m.
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=8192
JOY0=mouse
JOY1=keyboard
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
SETUPS="custom a500-1.5m"
