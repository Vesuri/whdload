# Zany Golf: common/template/game.conf describes every value.
TITLE="Zany Golf"
# Bored Seal's v1.1 slave (23-Jul-2006). Neither JOTD's nor StingRay's repository holds it;
# the source is the one the whdload.de install package ships (src/ZanyGolf.asm).
AUTHOR="Bored Seal"
UPSTREAM="ZanyGolf.lha (Bored Seal's v1.1 installer) ZanyGolfHD/src/ZanyGolf.asm"

# One slave, installed as ZanyGolfNTSC.slave in the Retroplay 1482 drawer
# (ZanyGolf_v1.1_NTSC_1482.lha); the install package unpacks beside it as ZanyGolfHD.
VARIANTS="ZanyGolf"
GAME_DIR=ZanyGolfNTSC
SLAVE_FILE=ZanyGolfNTSC.slave
SOURCE=src/ZanyGolf.asm

# vasm's default optimisations, not -devpac's none: the shipped slave was assembled with
# them (PC-relative lea and pea, short branches, abs.w); src/ZanyGolf.asm's own opt o4- and
# two cmpi make the build byte-identical. -pic: no relocations.
VASM_FLAGS="-m68000 -pic -x -Fhunkexe -nosym"

# A direct slave with OSEmu (data/OSEmu.400 at $400): no Kickstart, 512 KB chip memory.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
NTSC=1
