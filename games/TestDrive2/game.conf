# Test Drive II: common/template/game.conf describes every value.
TITLE="Test Drive II"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves T/TestDrive2/usr 6046174e"

# One slave: src/TestDrive2HD.s (with simulation.s, render.s, their patch list and the
# VERIFY-only simulation-verify.s), installed as TestDrive2.slave in the preinstalled
# archive's drawer, tmp/game/TestDrive2. The installer archive unpacks beside it, to
# tmp/game/TestDrive2Install.
VARIANTS="TestDrive2"
GAME_DIR=TestDrive2
SLAVE_FILE=TestDrive2.slave
SOURCE=src/TestDrive2HD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
# lvo/<library>.i bridges to the NDK's lvo/<library>_lib.i.
INCLUDES="src/include"

# kick13 KickEmu slave.
KICKS="kick34005.A500"
# The default machine: an A500 (68000) with 1 MB chip, 2 MB fast and FS-UAE's 512 KB slow
# RAM, PAL. TD_SETUP=a500|a1200|a1200-030 selects the reference machines (game.sh).
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=2048
SLOW_KB=512
# Tested on these and on the three TD_SETUP machines (docs/testing.md).
SETUPS="custom"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
