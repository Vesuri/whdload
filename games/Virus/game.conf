# Virus: common/template/game.conf describes every value.
TITLE="Virus"
# John Selck's V1.0 slave (15.01.99) from the whdload.de install package, which ships no
# source; neither JOTD's nor StingRay's repository holds it. src/Virus.s is a
# reconstruction that rebuilds the shipped slave byte for byte.
AUTHOR="John Selck"
UPSTREAM="none"

VARIANTS="Virus"
SLAVE_FILE=Virus.slave
# -no-opt: the reconstruction needs the shipped instruction encodings.
VASM_FLAGS="-m68000 -x -devpac -Fhunkexe -nosym -no-opt"

# A direct slave: no Kickstart. ws_BaseMemSize is 544 KB, so it needs more than 512 KB chip.
KICKS=""
SETUP=a500+
SETUPS="a500+ a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
