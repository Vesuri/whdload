# Vroom: common/template/game.conf describes every value.
TITLE="Vroom"
# Mr.Larmer's slaves (v1.0 02.02.2000, v1.3), updated to v1.4 (03.06.2006) by CFou. Neither
# JOTD's nor StingRay's repository holds them; the whdload.de install package ships the source.
AUTHOR="Mr.Larmer, CFou"
UPSTREAM="Vroom.lha (CFou's v1.4 installer) VroomHd/.src/Vroom_hd.asm, Vroom_Data_hd.asm"

# Vroom and its data disk. The Retroplay archives install Vroom alone (Vroom/) and both
# (Vroom&DataDisk/, the data disk's slave as DataDisk.Slave).
VARIANTS="Vroom VroomData"
case "$VARIANT" in
  Vroom) GAME_DIR=Vroom SLAVE_FILE=Vroom.Slave SOURCE=src/Vroom_hd.asm ;;
  VroomData) GAME_DIR="Vroom&DataDisk" SLAVE_FILE=DataDisk.Slave SOURCE=src/Vroom_Data_hd.asm ;;
esac
# Barfly's optimiser (BOPT O+) built the shipped slaves: branches sized to fit and MOVE #0
# as CLR. vasm pads code hunks with zeros, as Barfly did, only with -hunkpad=0.
VASM_FLAGS="-m68000 -x -opt-allbra -opt-clr -Fhunkexe -hunkpad=0 -nosym"

# A direct slave: no Kickstart, 512 KB chip memory.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
# On a 68020 and up the boot also gets CACHE, as the installed icon will: with the caches
# off the boot to the race takes 2.4 times as long, mostly the loader unpacking in Chip RAM
# (a1200-030: 2221 fields instead of 930). A WHD_DEFAULTS given to make keeps its own value.
# Enhanced framerate (CUSTOM1=1) is on too, as the installed icon will set it, unless
# ENHANCED=0 or WHD_ARGS sets CUSTOM1 (WHDLoad does not start with it twice). A 68000 ignores it.
game_prepare() {
  user_set WHD_DEFAULTS && return 0
  case "${AMIGA_SETUP:-}" in ''|a500|a500-1.5m|a500+) ;; *) WHD_DEFAULTS="$WHD_DEFAULTS CACHE" ;; esac
  case " ${WHD_ARGS-} " in
    *" CUSTOM1="*) ;;
    *) [ "${ENHANCED-1}" = 0 ] || WHD_DEFAULTS="$WHD_DEFAULTS CUSTOM1=1" ;;
  esac
}
JOY0=mouse
JOY1=keyboard
