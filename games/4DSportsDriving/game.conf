# 4D Sports Driving: common/template/game.conf describes every value.
TITLE="4D Sports Driving"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves 4/4DSportsDriving/usr cd97d6cc"

# One slave: src/4DSportsDrivingHD.s, installed as 4DSportsDriving.slave in the SPS 1461
# drawer that game_unpack extracts to tmp/game/4DSportsDriving_v1.2_1461/.
VARIANTS="4DSportsDriving"
GAME_DIR=4DSportsDriving_v1.2_1461/4DSportsDriving
SLAVE_FILE=4DSportsDriving.slave
SOURCE=src/4DSportsDrivingHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
# The slave is built against the NDK 3.2 includes, not the toolchain's.
NDK="${NDK:-${AMIGA_SHARE:-$HOME/.local/share/amiga}/ndk/Include_I}"
# verify is tools/build.sh's VERIFY=1 (the driving tape at the Normal rate); manual is its
# SIM_MANUAL=1 (the A4000 runtime with the mode menu, driven by hand). tools/build.sh
# builds every other combination of fixtures (docs/smooth-play-plan.md).
DEFINES_verify="-DVERIFY=1 -DTAPE_SIMULATION=10 -DTAPE_DETAIL=0 -DTAPE_FIRST=25 -DTAPE_GAP=25 -DTAPE_KEYS=200"
DEFINES_manual="-DVERIFY=1 -DTAPE_SIMULATION=50 -DTAPE_DETAIL=0 -DTAPE_FIRST=25 -DTAPE_GAP=25 -DTAPE_KEYS=200 -DSIM_MANUAL=1 -DSIM_PROBE=1 -DSIM_SCHEDULE=1 -DSIM_PHYSICS=1 -DSIM_A4000=1 -DSIM_A4000_NATIVE=1 -DSIM_MODE_MENU=1"

# The kick13 slave runs Kickstart 1.3 inside WHDLoad.
KICKS="kick34005.A500"
# The harness's machine: an A500 (68000) with 1 MB chip and 2 MB fast RAM, PAL. The
# benchmark cells A-E (tools/bench_cell.py, docs/open-work.md) are the machines the work
# was measured on; they set the machine themselves.
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=2048
SLOW_KB=512
NTSC=0
SETUPS="custom"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
[ "$JOY0" = none ] || JOY0_MODE="${JOY0_MODE:-mouse}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
