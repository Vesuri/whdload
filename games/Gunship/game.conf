# Gunship: common/template/game.conf describes every value.
TITLE="Gunship"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves G/Gunship/usr ce5a2a25"

# Two builds of src/GunshipHD.s: Gunship for the PAL release (SPS 0658) and GunshipNTSC
# (-DGUNSHIP_NTSC=1) for the NTSC release (SPS 1489), each run in its own installed drawer.
# Both carry the enhanced timing runtime (TIMING_RUNTIME, on unless GUNSHIP_NATIVE).
VARIANTS="Gunship GunshipNTSC"
SOURCE=src/GunshipHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
case "$VARIANT" in
  Gunship) GAME_DIR=Gunship SLAVE_FILE=Gunship.slave ;;
  GunshipNTSC) GAME_DIR=GunshipNTSC SLAVE_FILE=GunshipNTSC.slave DEFINES="-DGUNSHIP_NTSC=1" NTSC=1 ;;
esac
# Development builds (docs/development.md): input adds the timing-input capture to VERIFY;
# native is the original game loop without the timing runtime, for regression comparisons.
DEFINES_input="-DVERIFY=1 -DTIMING_INPUT=1"
DEFINES_native="-DGUNSHIP_NATIVE=1"

# kick13 KickEmu slave: 0.5 MB chip + 0.5 MB ExpMem + the 256 KB Kickstart, with PRELOAD.
KICKS="kick34005.A500"
# a500-fast (game.sh game_prepare): the shared cycle-exact a500 with 8 MB Zorro II fast RAM
# and no slow RAM.
SETUP=a500-fast
SETUPS="a500-fast a1200-fast a1200-030 a1200-040 a1200-060"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
