# Battlehawks 1942: common/template/game.conf describes every value.
TITLE="Battlehawks 1942"
# Galahad/Fairlight's v1.0 slave (12.05.2003) shipped without source; src/original/ is its
# byte-identical reconstruction (make build BUILD=original checks it against the installed one).
AUTHOR="Galahad/Fairlight"
UPSTREAM="none"

# One slave, run as the installed Battlehawks1942.Slave (Battlehawks1942_v1.0_0053.lha).
VARIANTS="Battlehawks1942"
SOURCE=src/Battlehawks1942.s

# Builds: release (WHDLoad 20 KickEmu), verify (the input tape, src/tape.s), c2pfull (VERIFY
# with the full-frame merge c2p experiment, src/c2p_full.s), tscale (VERIFY with BH's step
# divisor T multiplied by TSCALE, default 2; STICKREF=1 also divides the stick by the
# reference T 7), rectime (VERIFY with the flight tape timed in fields, for flight records
# compared across machines, tools/record.sh), mouse (VERIFY with the stick from the mouse
# alone: down, still, up, src/tape.s; MOUSE_DY counts per field, negative for up first)
# spancheck (rectime counting the spans that ran past their end row, which only stale
# code does; SPANPLAIN=1 without the span loop's flush or eviction) and original (game.sh:
# the reconstruction, compared with the installed slave). VASM_EXTRA=-DFASTMEMSIZE=0 gives the chip-only
# machine of v1.0 (docs/profiling.md).
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
INCLUDES="src/include"
DEFINES_c2pfull="-DVERIFY=1 -DC2P_FULL=1"
DEFINES_tscale="-DVERIFY=1 -DTSCALE=${TSCALE:-2}${STICKREF:+ -DSTICKREF=1}"
DEFINES_rectime="-DVERIFY=1 -DTAPE_TIME=1"
DEFINES_spancheck="-DVERIFY=1 -DTAPE_TIME=1 -DSPANCHECK=1${SPANPLAIN:+ -DSPANPLAIN=1}"
DEFINES_mouse="-DVERIFY=1 -DTAPE_MOUSE=1${MOUSE_DY:+ -DMOUSE_DY=$MOUSE_DY}"

KICKS="kick34005.A500"
# An A500 with 1 MB chip and 2 MB fast RAM; tools/fixed_window.sh sets the capture machine
# (512 KB chip, 8 MB fast, docs/profiling.md §2).
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=2048
SETUPS="custom"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
