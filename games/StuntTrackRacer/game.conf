# Stunt Track Racer: common/template/game.conf describes every value.
TITLE="Stunt Track Racer"
# Codetapper's v1.0 slave (06.10.2000) shipped without source; src/StuntTrackRacer.s
# reconstructs it byte for byte (docs/development.md).
AUTHOR="Codetapper"
UPSTREAM="none"

# The Retroplay archive installs the slave as StuntTrackRacerNTSC.Slave in StuntTrackRacerNTSC.
VARIANTS="StuntTrackRacer"
GAME_DIR=StuntTrackRacerNTSC
SLAVE_FILE=StuntTrackRacerNTSC.Slave
# -devpac (no optimisation): the slave sizes its branches. It has no relocations.
VASM_FLAGS="-m68000 -x -devpac -Fhunkexe -nosym"
# The Unleashed blob, generated by game.sh's game_build, and Stunt Car Racer's relocTable.
INCLUDES="tmp/include ../StuntCarRacer/src"

# A direct slave: no Kickstart, 512 KB chip memory and an optional ExpMem (the enhanced
# framerate's copy). The North American release: NTSC.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
NTSC=1
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
