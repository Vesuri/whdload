# Their Finest Hour: common/template/game.conf describes every value.
TITLE="Their Finest Hour"
# Psygore's 1.1 slave shipped without source; src/TheirFinestHour.s reconstructs it from
# its disassembly.
AUTHOR="Psygore"
UPSTREAM="none"

# One slave, run as the installed TheirFinestHour.Slave (TheirFinestHour_v1.1_0037.lha).
VARIANTS="TheirFinestHour"
SOURCE=src/TheirFinestHour.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
INCLUDES="src/include"

KICKS="kick34005.A500"
# An A500 with 1 MB chip and 2 MB fast RAM (docs/development.md lists the measurement
# machines).
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=2048
SETUPS="custom"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
