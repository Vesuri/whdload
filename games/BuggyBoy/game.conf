# Buggy Boy: common/template/game.conf describes every value.
TITLE="Buggy Boy"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves B/BuggyBoy/usr eb73c315"

# One slave: src/BuggyBoyHD.s (Codetapper's 1.3, the install package's source/BuggyBoyHD.s),
# installed as BuggyBoy.slave in the preinstalled archive's drawer, tmp/game/BuggyBoy
# (Retroplay 0465, files in data/). The whdload.de install package unpacks beside it, to
# tmp/game/BuggyBoyInstall.
VARIANTS="BuggyBoy"
GAME_DIR=BuggyBoy
SLAVE_FILE=BuggyBoy.slave
SOURCE=src/BuggyBoyHD.s

# -pic: WHDLoad refuses a slave with relocations, so the build must have none. tmp/include
# holds the keyboard.s that game.sh's game_build generates from WHDLoad 20.1's.
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
INCLUDES="tmp/include"

# A direct file slave: the game runs on its own in the 512 KB base memory, no Kickstart.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
