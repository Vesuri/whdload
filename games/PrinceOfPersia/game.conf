# Prince of Persia: common/template/game.conf describes every value.
TITLE="Prince of Persia"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves P/PrinceOfPersia/usr eb73c315"

# One slave for the UK, US, German and French versions: src/PrinceOfPersiaHD.s with its
# includes. savegame.s INCBINs the xen/8 font, src/xen_8.bin, which game_build takes from
# the installer archive (game.sh). The VERIFY build adds the replay and timing instruments
# (PrinceOfPersiaVerify.s); VASM_EXTRA='-DEXPLORE_LEVEL=n' and the like adjust it.
VARIANTS="PrinceOfPersia"
SOURCE=src/PrinceOfPersiaHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
DEFINES_verify="-DVERIFY"
# The slave is built against the NDK 3.2 includes, not the toolchain's.
NDK="${NDK:-${AMIGA_SHARE:-$HOME/.local/share/amiga}/ndk/Include_I}"

# The installed game a run copies: POP_VERSION=uk (default; the 1823 install, UK 1b),
# us (the NTSC 1407 install, run on NTSC), de or fr. Each is its own archive and drawer.
case "${POP_VERSION:-uk}" in
  uk) GAME_DIR=PrinceOfPersia; SLAVE_FILE=PrinceOfPersia.slave ;;
  us) GAME_DIR=PrinceOfPersiaNTSC; SLAVE_FILE=PrinceOfPersiaNTSC.slave; NTSC="${NTSC:-1}" ;;
  de) GAME_DIR=PrinceOfPersiaDe; SLAVE_FILE=PrinceOfPersiaDe.slave ;;
  fr) GAME_DIR=PrinceDePerseFr; SLAVE_FILE=PrinceDePerseFr.slave ;;
  *) GAME_DIR="unknown-POP_VERSION-$POP_VERSION (uk, us, de or fr)" ;;
esac

# Not a KickEmu slave: no Kickstart in DEVS:.
KICKS=""
# The slave needs 0.5 MB chip and ~0.8 MB ExpMem: an A500 with 1.5 MB slow RAM (plain a500's
# 512 KB is too little). Tested on these (docs/PERFORMANCE_PLAN.md D1, D3).
SETUP=a500-1.5m
SETUPS="a500-1.5m a1200-040 a1200-060"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
