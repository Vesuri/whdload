# Sentinel: common/template/game.conf describes every value.
TITLE="The Sentinel"
# Harry's slave (V1.0, October 1998) with StingRay's V1.01 (15.09.2017). Neither JOTD's nor
# StingRay's repository holds it; src/Sentinel.s is the source the whdload.de install
# package ships.
AUTHOR="Harry & StingRay"
UPSTREAM="Sentinel.lha (StingRay's v1.01 installer) Sentinel/Source/Sentinel.s"

VARIANTS="Sentinel"
SLAVE_FILE=Sentinel.Slave

# A direct slave: no Kickstart, 512 KB chip memory.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
