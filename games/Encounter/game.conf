# Encounter: common/template/game.conf describes every value.
TITLE="Encounter"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves E/Encounter/usr 1635ba0e"

# One slave: src/EncounterHD.s (the install package's source/EncounterHD.asm), installed as
# Encounter.slave in the preinstalled archive's drawer, tmp/game/Encounter (SPS 0651, one
# disk image, disk.1). The whdload.de install package unpacks beside it, to
# tmp/game/EncounterHD.
VARIANTS="Encounter"
GAME_DIR=Encounter
SLAVE_FILE=Encounter.slave
SOURCE=src/EncounterHD.s

# A direct disk slave: the game runs on its own in the 512 KB base memory, no Kickstart.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
