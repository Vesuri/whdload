# Mercenary 3: common/template/game.conf describes every value.
TITLE="Mercenary 3"
# The shipped 1.2 slave (Harry's installer, merged with Graham's ReSourced slave by Wepl)
# came with its source in the official installer; src/original/ reconstructs the shipped
# bytes from it.
AUTHOR="Harry, Graham and Wepl"
UPSTREAM="none"

# Mercenary3 is the performance slave; Mercenary3-original rebuilds the shipped 1.2 slave
# from src/original/ (make original compares it with the installed one). Both run as the
# installed Mercenary3.Slave.
VARIANTS="Mercenary3 Mercenary3-original"
GAME_DIR=Mercenary3_v1.2_0356/Mercenary3
SLAVE_FILE=Mercenary3.Slave
case "$VARIANT" in
  Mercenary3-original) SOURCE=src/original/Mercenary3.slave.asm ;;
  *) SOURCE=src/Mercenary3.slave.asm ;;
esac
# -no-opt: the reconstruction needs the shipped instruction encodings.
VASM_FLAGS="-m68000 -x -devpac -Fhunkexe -nosym -no-opt"

# A direct (no-OS) slave: no Kickstart image inside WHDLoad.
KICKS=""
# The A500-equivalent: 68000, 512 KB chip, 1.5 MB slow, no fast RAM.
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=512
FAST_KB=0
SLOW_KB=1536
SETUPS="custom a500-1.5m a1200 a1200-fast a1200-030"
WHD_DEFAULTS="CACHE PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
