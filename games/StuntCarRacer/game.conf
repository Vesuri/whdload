# Stunt Car Racer: common/template/game.conf describes every value.
TITLE="Stunt Car Racer"
# Codetapper's slave (v1.0 1997 to v1.3 2004), made PC-relative with the keyboard fixed by
# StingRay in v1.4 (08.07.2023). src/StuntCarRacer.s is the source the v1.4 install package
# ships (docs/development.md).
AUTHOR="Codetapper and StingRay"
UPSTREAM="StuntCarRacer.lha (Codetapper's and StingRay's v1.4 installer) StuntCarRacerHD/Source/StuntCarRacer.s"

# One slave, which runs the TNT (The New Tracks) version when SCR-TNT is in its drawer and the
# disk version otherwise. The Retroplay archives install it twice: StuntCarRacer (Disk.1) and
# StuntCarRacerTNT (SCR-TNT). Both variants build the same bytes; they differ only in the
# drawer they boot.
VARIANTS="StuntCarRacer StuntCarRacerTNT"
SOURCE=src/StuntCarRacer.s
case "$VARIANT" in
  StuntCarRacer) GAME_DIR=StuntCarRacer SLAVE_FILE=StuntCarRacer.slave ;;
  StuntCarRacerTNT) GAME_DIR=StuntCarRacerTNT SLAVE_FILE=StuntCarRacerTNT.slave ;;
esac
# -devpac (no optimisation): the source sizes its branches. The slave is PC-relative.
VASM_FLAGS="-m68000 -x -devpac -Fhunkexe -nosym"

# A direct slave: no Kickstart. 512 KB chip memory and a 4 KB ExpMem (the stack).
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
