# Star Wars: common/template/game.conf describes every value.
TITLE="Star Wars"
# StingRay's v2.00 slave (10.08.2016). His WHDLoad patches repository and JOTD's do not hold
# it; the source is the one his installer ships (Source/StarWars_WHD.s).
AUTHOR="StingRay"
UPSTREAM="StarWars.lha (StingRay's v2.00 installer) StarWars_Install/Source/StarWars_WHD.s"

# One slave. The drawer is the Retroplay SPS 0403 one (StarWars_v2.0_0403.lha); the
# installer archive unpacks beside it as StarWars_Install.
VARIANTS="StarWars"
GAME_DIR=StarWars
SLAVE_FILE=StarWars.Slave
SOURCE=src/StarWars_WHD.s

# A kick13 (KickEmu) slave: dos.library LoadSegs data/starwars.
KICKS="kick34005.A500"
# 512 KB chip and 512 KB other memory for the game, plus PRELOAD and the Kickstart image:
# the A500 with 1.5 MB slow RAM (a500 alone cannot allocate the ExpMem under Workbench).
SETUP=a500-1.5m
SETUPS="a500-1.5m a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
