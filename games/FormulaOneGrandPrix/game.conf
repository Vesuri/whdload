# Formula One Grand Prix: common/template/game.conf describes every value.
TITLE="Formula One Grand Prix"
# Codetapper's 1.0 slave shipped without source; src/F1GP.s is a rebuilt loader.
AUTHOR="Codetapper"
UPSTREAM="none"

# One slave, src/F1GP.s, run as the installed 4-disk release's slave.
VARIANTS="F1GP"
GAME_DIR=FormulaOneGrandPrix4Disk
SLAVE_FILE=FormulaOneGrandPrix4Disk.Slave
# game.sh game_build generates tables from the pinned game first, then assembles with these
# flags and defines (include order: tmp/slave/include, NDK_ASM, WHDLoad, NDK, WHDLoad sources).
VASM_FLAGS="-m68000 -no-opt -pic -x -devpac -Fhunkexe -nosym"
DEFINES_release="-DDEVELOPER=1 -DPLAYER=1 -DVERIFY=0"
DEFINES_developer="-DDEVELOPER=1"
DEFINES_verify="-DDEVELOPER=1 -DVERIFY=1"

KICKS="kick34005.A500"
# The A500-equivalent machine: 512 KB chip and 1.5 MB slow RAM, no fast RAM.
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=512
FAST_KB=0
SLOW_KB=1536
SETUPS="custom a500-1.5m a1200 a1200-fast a1200-030 a1200-040 a1200-060"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 CONFIGDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
