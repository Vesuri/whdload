# Vroom Multiplayer: common/template/game.conf describes every value.
TITLE="Vroom Multiplayer"
# Mr.Larmer's slave (v1.0-1.3), updated to v1.4-1.6 (03.06.2006) by CFou. Neither JOTD's nor
# StingRay's repository holds it; the whdload.de install package ships the source.
AUTHOR="Mr.Larmer, CFou"
UPSTREAM="VroomMultiplayer.lha (CFou's v1.6 installer) VroomMultiplayerHd/.src/VroomMultiplayerHD.asm"

VARIANTS="VroomMultiplayer"
GAME_DIR=VroomMultiPlayer
SLAVE_FILE=VroomMultiplayer.Slave
SOURCE=src/VroomMultiplayerHD.asm
# Barfly's optimiser (BOPT O+) built the shipped slave: branches sized to fit and MOVE #0
# as CLR. vasm pads code hunks with zeros, as Barfly did, only with -hunkpad=0.
VASM_FLAGS="-m68000 -x -opt-allbra -opt-clr -Fhunkexe -hunkpad=0 -nosym"

# A direct slave: no Kickstart, 512 KB chip memory.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
# On a 68020 and up the boot also gets CACHE, as the installed icon will, and Enhanced
# framerate (CUSTOM1=1) unless ENHANCED=0 or WHD_ARGS sets CUSTOM1 (WHDLoad does not start
# with it twice). A 68000 ignores it. A WHD_DEFAULTS given to make keeps its own value.
game_prepare() {
  user_set WHD_DEFAULTS && return 0
  case "${AMIGA_SETUP:-}" in ''|a500|a500-1.5m|a500+) ;; *) WHD_DEFAULTS="$WHD_DEFAULTS CACHE" ;; esac
  case " ${WHD_ARGS-} " in
    *" CUSTOM1="*) ;;
    *) [ "${ENHANCED-1}" = 0 ] || WHD_DEFAULTS="$WHD_DEFAULTS CUSTOM1=1" ;;
  esac
}
JOY0=mouse
JOY1=keyboard
