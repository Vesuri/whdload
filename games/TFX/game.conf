# TFX: common/template/game.conf describes every value.
TITLE="TFX"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves T/TFX/usr ce5a2a25"

# The slave, src/TFXHD.s, installed as TFXAGA.slave in the drawer of the preinstalled
# version 2.1 archive that game_unpack extracts to tmp/game/TFX_v2.1_AGA/. fpsp040 and
# fpsp060 are the Motorola FPSP builds the slave loads from data/ on a 68040 or 68060
# (src/code040.s, src/code060.s); they ship unchanged and are built here to prove that.
# They are not slaves: run.sh refuses them (game.sh).
VARIANTS="TFX fpsp040 fpsp060"
GAME_DIR=TFX_v2.1_AGA/TFXAGA
case "$VARIANT" in
  TFX)
    SLAVE_FILE=TFXAGA.slave
    SOURCE=src/TFXHD.s
    # No -m68000, -pic or -devpac: the slave uses 020 memory-indirect modes.
    VASM_FLAGS="-nosym -Fhunkexe"
    ;;
  fpsp040|fpsp060)
    SLAVE_FILE=data/$VARIANT
    SOURCE=src/code${VARIANT#fpsp}.s
    VASM_FLAGS="-maxerrors=0 -devpac -nosym -Fhunkexe"
    ;;
esac
# No VERIFY instrumentation. BUILD=chiponly is the diagnostic build that keeps all game
# data in chip RAM (HRTMON, and $FC holds the first segment); the chip relocation tables in
# src/chip_reloc_new.i were derived from it.
DEFINES_chiponly="-DCHIP_ONLY"

# kick31 KickEmu slave: Kickstart 3.1 A1200 image (and .RTB).
KICKS="kick40068.A1200"
# The target: an A1200 with a 68040 and 32 MB of Zorro III fast RAM (Apollo 1240/40), the
# harness's default machine; game.sh adds the Zorro III RAM unless EXTRA_ARGS is set.
# a1200-fast, a1200-030 and a1200-060 are the 020/030/060 regression machines.
SETUP=a1200-040
SETUPS="a1200-040 a1200-fast a1200-030 a1200-060"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 CONFIGDELAY=0 NOREQ"
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
