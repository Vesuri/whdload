# Stellar 7: common/template/game.conf describes every value.
TITLE="Stellar 7"
# Psygore's 1.0 slave shipped without source; src/Stellar7.s reconstructs its startup.
AUTHOR="Psygore"
UPSTREAM="none"

# Three builds of src/Stellar7.s, all run as the installed Stellar7NTSC.Slave:
# Stellar7 (original timing), Stellar7-Sim60 (60 Hz fixed-rate simulation, 68020+) and
# Stellar7-Sim68000 (the same at SIM68000_SUBSTEPS, default 3: 15 Hz on 68000).
VARIANTS="Stellar7 Stellar7-Sim60 Stellar7-Sim68000"
GAME_DIR=Stellar7NTSC
SLAVE_FILE=Stellar7NTSC.Slave
SOURCE=src/Stellar7.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
INCLUDES="src/include"
case "$VARIANT" in
  Stellar7-Sim60) DEFINES="-DSIM60=1" ;;
  Stellar7-Sim68000) DEFINES="-DSIM60=1 -DS60_SUBSTEPS=${SIM68000_SUBSTEPS:-3} -DPOLYGON_BLIT_IRQ=1" ;;
esac
# VERIFY_FLAGS adds diagnostic defines to the VERIFY build (docs/development.md).
DEFINES_verify="-DVERIFY=1 ${VERIFY_FLAGS:-}"

KICKS="kick34005.A500"
# The supplied English NTSC game on an A500 with 512 KB chip and 1.5 MB slow RAM. SETUPS
# are the validation machines (tools/machines.py): the 15 Hz Sim68000 build on the A500,
# Sim60 on a typical A1200 and at the fast end.
SETUP=a500-1.5m
SETUPS="a500-1.5m a1200-fast a1200-060"
NTSC=1
JOY0=mouse
JOY1=keyboard
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
# SETUP=custom (explicit machine variables from the older capture tools) starts from the
# same A500.
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=512
FAST_KB=0
SLOW_KB=1536
