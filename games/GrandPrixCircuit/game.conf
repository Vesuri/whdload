# Grand Prix Circuit: common/template/game.conf describes every value.
TITLE="Grand Prix Circuit"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves G/GrandPrixCircuit 48557a5f"

# One slave: src/GrandPrixCircuitHD.s, installed as GrandPrixCircuit.Slave in the v1.0 SPS
# 0008 drawer that game_unpack extracts to tmp/game/GrandPrixCircuit_v1.0_0008/.
VARIANTS="GrandPrixCircuit"
GAME_DIR=GrandPrixCircuit_v1.0_0008/GrandPrixCircuit
SLAVE_FILE=GrandPrixCircuit.Slave
SOURCE=src/GrandPrixCircuitHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
# The slave is built against the NDK 3.2 includes, not the toolchain's.
NDK="${NDK:-${AMIGA_SHARE:-$HOME/.local/share/amiga}/ndk/Include_I}"
# VERIFY adds the fixtures (docs/development.md). VERIFY_FLAGS=-DVERIFY_TAPE=1 makes it the
# Phase 6 tape candidate, which replays the private joystick recording phase6-tape.bin
# (local, in tmp/include/), as the harness's VASMFLAGS did.
INCLUDES="tmp/include"
DEFINES_verify="-DVERIFY=1 ${VERIFY_FLAGS:-}"

KICKS="kick34005.A500"
# The harness's A500: 68000, 512 KB chip + 1.5 MB slow RAM, no fast RAM, PAL.
# tools/run-a1200.sh and tools/run-68030.sh are its two faster machines.
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=512
FAST_KB=0
SLOW_KB=1536
NTSC=0
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
SETUPS="custom a1200-030"
