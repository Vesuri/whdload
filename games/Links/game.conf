# Links: common/template/game.conf describes every value.
TITLE="Links - The Challenge of Golf"
# StingRay's slave (V1.00 13.04.2013, V1.01 28.04.2013). Neither JOTD's nor StingRay's
# repository holds it; src/Links_WHD.s is the source the whdload.de install package ships.
AUTHOR="StingRay"
UPSTREAM="Links.lha (StingRay's v1.01 installer) Links_Install/Source/Links_WHD.s"

# One slave supports both game versions. The variants build it twice to boot each version's
# Retroplay drawer: Links/ holds v1.53 (SPS 2481), LinksNTSC/ v1.50 (SPS 2010). The drawers
# with the course disks, Links&DataDisks/ and Links&DataDisksNTSC/, take
# GAME_DIR=... SLAVE_FILE=...Slave on the command line.
VARIANTS="Links LinksNTSC"
case "$VARIANT" in
  Links) GAME_DIR=Links SLAVE_FILE=Links.slave ;;
  LinksNTSC) GAME_DIR=LinksNTSC SLAVE_FILE=LinksNTSC.slave ;;
esac
SOURCE=src/Links_WHD.s

# kick13 (Kickstart 1.3 emulation): 512 KB BaseMem and 1.25 MB ExpMem (the slave's 1 MB and
# what kick13.s adds). The 68000 machine is an A500 with 1 MB chip and 2 MB fast RAM: the
# a500-1.5m's 1 MB of slow RAM cannot hold the ExpMem, nor the plain a1200's chip RAM. The
# a1200-030 is the cache machine, with Zorro III fast RAM for 32-bit addresses
# (EXTRA_ARGS='--fast_memory=0 --zorro_iii_memory=32768').
KICKS="kick34005.A500"
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=2048
SETUPS="custom a1200-fast a1200-030"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
