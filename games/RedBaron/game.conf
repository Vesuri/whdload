# Red Baron: common/template/game.conf describes every value.
TITLE="Red Baron"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves R/RedBaron/usr cd97d6cc"

# One slave: src/RedBaronHD.s, installed as RedBaron.slave in the drawer that
# RedBaron_v2.1.lha (the installed game) unpacks to tmp/game/RedBaron.
VARIANTS="RedBaron"
SLAVE_FILE=RedBaron.slave
SOURCE=src/RedBaronHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
# The slave is built against the NDK 3.2 includes, not the toolchain's.
NDK="${NDK:-${AMIGA_SHARE:-$HOME/.local/share/amiga}/ndk/Include_I}"
# The verify and developer builds are the defaults (-DVERIFY=1, -DDEVELOPER=1); the VERIFY_*
# options are in tools/build.sh (docs/development.md).

# kick13 KickEmu slave. The harness's machine: an A500 (68000) with 1 MB chip and 2 MB fast
# RAM, PAL, mouse in port 0. The enhancements need CUSTOM2=1 (WHD_ARGS), as the icons set.
KICKS="kick34005.A500"
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=2048
SLOW_KB=0
NTSC=0
SETUPS="custom a1200-fast a1200-030 a1200-040 a1200-060"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
[ "$JOY0" = none ] || JOY0_MODE="${JOY0_MODE:-mouse}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
