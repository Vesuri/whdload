# Robinson's Requiem: common/template/game.conf describes every value.
TITLE="Robinson's Requiem"
# CFou!'s v1.2 slaves (29.03.2013). Neither JOTD's nor StingRay's repository holds them; the
# source is the one his install package ships (RobinsonsRequiemHd/.src/).
AUTHOR="CFou!"
UPSTREAM="RobinsonsRequiem.lha (CFou!'s v1.2 installer) RobinsonsRequiemHd/.src/RobinsonSRequiemEcs.asm RobinSonSRequiemAga.asm"

# Two slaves, one per game version, each run in its own Retroplay drawer:
#   RobinsonsRequiem     the ECS/OCS game (kick13 KickEmu), drawer RobinsonsRequiem (v1.2)
#   RobinsonsRequiemAGA  the AGA game (kick31 KickEmu), drawer RobinsonsRequiemAGA (v1.2 AGA 1866)
# The install package names them RobinsonSRequiemECS.Slave and RobinsonSRequiemAga.Slave.
VARIANTS="RobinsonsRequiem RobinsonsRequiemAGA"
# src/include holds the lvo/intuition.i bridge to the NDK's lvo/intuition_lib.i.
INCLUDES="src/include"
case "$VARIANT" in
  RobinsonsRequiem)
    SOURCE=src/RobinsonSRequiemEcs.asm
    KICKS="kick34005.A500"
    # The slave asks for 1 MB chip (CHIPMEMSIZE $100000) and a 256 KB ExpMem besides the
    # Kickstart: an A500 with 1 MB chip and 2 MB fast.
    SETUP=custom
    AMIGA_MODEL=A500
    CPU=68000
    CHIP_KB=1024
    FAST_KB=2048
    SETUPS="custom"
    ;;
  RobinsonsRequiemAGA)
    SOURCE=src/RobinSonSRequiemAga.asm
    KICKS="kick40068.A1200"
    # WHDLF_ReqAGA, 1.6 MB chip (CHIPMEMSIZE $1A0000) and a 256 KB ExpMem besides the
    # Kickstart: the A1200 with fast memory.
    SETUP=a1200-fast
    SETUPS="a1200-fast"
    ;;
esac

WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
