# Hard Drivin': common/template/game.conf describes every value.
TITLE="Hard Drivin'"
# JOTD's repository holds the slave (Halibut Software / John Girvin's, reworked by JOTD).
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves H/HardDrivin/usr 7003fc6f"

# One slave: src/HardDrivinHD.s, installed as HardDrivin.Slave in the SPS 0126 drawer that
# game_unpack extracts to tmp/game/HardDrivin_v3.0_0126/.
VARIANTS="HardDrivin"
GAME_DIR=HardDrivin_v3.0_0126/HardDrivin
SLAVE_FILE=HardDrivin.Slave
SOURCE=src/HardDrivinHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
# The slave is built against the NDK 3.2 includes, not the toolchain's.
NDK="${NDK:-${AMIGA_SHARE:-$HOME/.local/share/amiga}/ndk/Include_I}"
# The fixtures are separate VERIFY_* defines (docs/development.md). The verify build takes
# them from VERIFY_FLAGS, by default the arcade handling fixture; the named builds are the
# instruments the docs use most.
DEFINES_verify="${VERIFY_FLAGS:--DVERIFY_HANDLING_MATH=1}"
DEFINES_attract="-DVERIFY_ATTRACT=1"
DEFINES_development="-DHD_DEVELOPMENT=1"

KICKS="kick34005.A500"
# The SPS 0126 edition on an A500 (68000) with 512 KB chip and 1.5 MB slow RAM, PAL.
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=512
FAST_KB=0
SLOW_KB=1536
NTSC=0
# Steering and menus use the mouse in port 0.
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
[ "$JOY0" = none ] || JOY0_MODE="${JOY0_MODE:-mouse}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
SETUPS="custom a1200-040"
