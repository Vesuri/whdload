# Ferrari Formula One: common/template/game.conf describes every value.
TITLE="Ferrari Formula One"
# StingRay's v1.01 slave. His WHDLoad patches repository does not hold it; the source is the
# one his installer ships (Source/FerrariFormulaOne_WHD.s). The performance mode (CUSTOM2)
# is the work here.
AUTHOR="StingRay"
UPSTREAM="FerrariFormulaOne.lha (StingRay's v1.01 installer) FerrariFormulaOne_Install/Source/FerrariFormulaOne_WHD.s"

# One slave: tools/build.py assembles src/FerrariFormulaOne_WHD.s (the host) and its three
# payloads (68000, 68020 and the fine 68020+Fast simulation) and binds them through the
# game's relocation records (game.sh game_build). The drawer is the Retroplay SPS 0481 one.
VARIANTS="FerrariFormulaOne"
GAME_DIR=FerrariFormulaOne
SLAVE_FILE=FerrariFormulaOne.slave
SOURCE=src/FerrariFormulaOne_WHD.s
# make build BUILD=fast: the Fast RAM rendering work in progress (docs/FASTRAM_PLAN.md).

# A kick13 (KickEmu) slave.
KICKS="kick34005.A500"
# The harness's machine: an A500 with 512 KB chip and 1.5 MB slow memory. The checks use
# the profiles in tools/ff1check.py (docs/RELEASE_QUALIFICATION.md).
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=512
SLOW_KB=1536
FAST_KB=0
SETUPS="custom a500-1.5m a1200 a1200-fast a1200-030 a1200-040"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=none
JOY1=none
# No Workbench floppy, as every capture and check in docs/ was made.
WB=0
