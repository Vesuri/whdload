# AlienBreed3D: common/template/game.conf describes every value.
TITLE="Alien Breed 3D"
# Psygore's slave 1.3 (08.01.2020) from the whdload.de install package, whose source
# (src/AlienBreed3DHD_src.lzx) is XPK IDEA encrypted; neither JOTD's nor StingRay's
# repository holds it. src/AlienBreed3D.s is a reconstruction that rebuilds both shipped
# slaves byte for byte.
AUTHOR="Psygore"
UPSTREAM="none"

# AlienBreed3D.slave, and AlienBreed3D_nomusic.slave (NOMUSIC: 428 KB chip, no HackAB3D).
# Both run the Retroplay drawer, whose AlienBreed3DAGA.slave is AlienBreed3D.slave.
VARIANTS="AlienBreed3D AlienBreed3D_nomusic"
SOURCE=src/AlienBreed3D.s
GAME_DIR=AlienBreed3DAGA
SLAVE_FILE=AlienBreed3DAGA.slave
case "$VARIANT" in
  AlienBreed3D_nomusic) DEFINES="-DNOMUSIC" ;;
esac
# BUILD=original: Psygore's slaves, byte for byte (game_check compares them).
DEFINES_original="-DORIGINAL"
# 68020 code; -no-opt: the reconstruction needs the shipped instruction encodings.
VASM_FLAGS="-m68020 -x -devpac -Fhunkexe -nosym -no-opt"

# A direct slave (no Kickstart): 576 KB chip and 1.34 MB ExpMem, AGA and a 68020.
KICKS=""
SETUP=a1200-030
SETUPS="a1200-fast a1200-030 a1200-040"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
