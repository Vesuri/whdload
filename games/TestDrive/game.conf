# Test Drive: common/template/game.conf describes every value.
TITLE="Test Drive"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves T/TestDrive/usr 48557a5f"

# One slave: src/TestDriveHD.s (with simulation.s, render.s and their patch lists),
# installed as TestDrive.slave in the drawer of the preinstalled 1.3 archive that game_unpack
# extracts to tmp/game/TestDrive_v1.3_0089/.
VARIANTS="TestDrive"
GAME_DIR=TestDrive_v1.3_0089/TestDrive
SLAVE_FILE=TestDrive.slave
SOURCE=src/TestDriveHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
# The slave is built against the NDK 3.2 includes, not the toolchain's.
NDK="${NDK:-${AMIGA_SHARE:-$HOME/.local/share/amiga}/ndk/Include_I}"

# kick13 KickEmu slave.
KICKS="kick34005.A500"
# The harness's default machine: an A500 (68000) with 1 MB chip and 2 MB fast RAM, PAL.
# TD_SETUP=a500|a1200|a1200-030 selects Test Drive II's reference machines (game.sh).
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=2048
SLOW_KB=0
# Tested on these and on the three TD_SETUP machines (docs/phase11.md).
SETUPS="custom a1200-040"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
