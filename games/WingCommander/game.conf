# Wing Commander: common/template/game.conf describes every value.
TITLE="Wing Commander"
# Psygore's v1.0 slaves shipped without source; tools/reconstruct.py and
# tools/ocs_reconstruct.py reassemble them from the pinned originals in tmp/game/.
AUTHOR="Psygore"
UPSTREAM="none"

# The CD32 version (AGA, Kickstart 3.1) and the OCS disk version (SPS 1657, Kickstart 1.3).
# Each installs into its own drawer of the same name. game.sh builds them with the
# generators in tools/ (game_build): release, verify (CD32 only), reconstruct (the
# original slave, reassembled byte for byte) and the CD32 render, render-control and
# render-verify diagnostics.
VARIANTS="WingCommanderCD32 WingCommander"
case "${VARIANT:-}" in
  WingCommanderCD32)
    KICKS="kick40068.A1200"
    SETUP=a1200-fast
    ;;
  WingCommander)
    KICKS="kick34005.A500"
    # The public candidate's machine. An explicit SLAVE (original or diagnostic builds)
    # boots the A500 with 4 MB of Zorro II Fast RAM instead (game.sh game_prepare).
    SETUP=a3000
    ;;
esac
SETUPS="a1200-fast a1200-030 a1200-040 a1200-060 a3000 a500"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
# A debug run never takes over a gdb-stub port, not even one this directory's emulator holds.
FSUAE_CLAIM_STRICT=1
