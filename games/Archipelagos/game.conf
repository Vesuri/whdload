# Archipelagos: common/template/game.conf describes every value.
TITLE="Archipelagos"
# StingRay's slave (v1.1 20.12.2015, v1.2 31.08.2023; John Selck's v1.0 1999). Neither JOTD's
# nor StingRay's repository holds it. src/ArchipelagosFiles_WHD.s is the v1.1 source the
# whdload.de install package ships, with the v1.2 changes reconstructed from the slave the
# Retroplay archives install (docs/development.md).
AUTHOR="StingRay"
UPSTREAM="Archipelagos.lha (StingRay's v1.2 installer) Archipelagos_Install/Source/ArchipelagosFiles_WHD.s"

# One slave, which tells SPS 627 (Europe) from SPS 628 (US) by the main file's CRC. The
# Retroplay archives install it twice: Archipelagos (0627) and ArchipelagosNTSC (0628).
# Both variants build the same bytes; they differ only in the drawer they boot.
VARIANTS="Archipelagos ArchipelagosNTSC"
SOURCE=src/ArchipelagosFiles_WHD.s
case "$VARIANT" in
  Archipelagos) GAME_DIR=Archipelagos SLAVE_FILE=Archipelagos.slave ;;
  ArchipelagosNTSC) GAME_DIR=ArchipelagosNTSC SLAVE_FILE=ArchipelagosNTSC.slave NTSC=1 ;;
esac
# -pic: the slave has no relocations.
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"

# A direct slave: no Kickstart, 512 KB chip memory.
KICKS=""
SETUP=a500
SETUPS="a500 a1200"
# Enhanced framerate (CUSTOM1) on, as the installed icon sets it; ENHANCED=0 runs the game as
# without it (WHDLoad's caches, the body in chip memory, no 68020 patches).
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ CUSTOM1=${ENHANCED-1}"
JOY0=mouse
JOY1=keyboard
