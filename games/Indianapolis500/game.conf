# Indianapolis 500: common/template/game.conf describes every value.
TITLE="Indianapolis 500"
# StingRay's v3.0 slave from his WHDLoad patches repository; the high frame rate option
# (CUSTOM1) is the work here.
AUTHOR="StingRay"
UPSTREAM="https://github.com/MK1Roxxor/WHDLoad_Patches Games/Indianapolis500_*.s e05698e"

# One slave: src/Indianapolis500_WHD.s with its modules (Motion, Spans, Clear, Line, Colour)
# and the instruments only VERIFY, DRIVING_TEST or SOFT_TIMING assemble (PixelVerify,
# DrivingTest, SoftTiming). The drawer is the SPS 0686 installed archive's.
VARIANTS="Indianapolis500"
GAME_DIR=Indianapolis500
SLAVE_FILE=Indianapolis500.Slave
SOURCE=src/Indianapolis500_WHD.s
VASM_FLAGS="-m68000 -pic -x -devpac -Fhunkexe -nosym"
# Diagnostic builds (docs/profiling.md): make build BUILD=<name>.
DEFINES_race="-DDRIVING_TEST=2"
DEFINES_practice="-DDRIVING_TEST=1"
DEFINES_race_verify="-DVERIFY=1 -DDRIVING_TEST=2"
DEFINES_timing="-DTIMING=1"
DEFINES_soft="-DDRIVING_TEST=2 -DSOFT_TIMING=1"
DEFINES_replay="-DDRIVING_TEST=2 -DDRIVING_REPLAY=${DRIVING_REPLAY:-600}"

# A direct (no-OS) slave: no Kickstart image inside WHDLoad.
KICKS=""
# The harness's default machine: an A500 (68000) with 1 MB chip, 2 MB fast and the
# default 512 KB slow RAM. Measurements use the machines in docs/profiling.md.
SETUP=custom
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=2048
SETUPS="custom a500-1.5m a1200 a1200-030"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
