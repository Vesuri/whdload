# MarbleMadness: common/template/game.conf describes every value.
TITLE="Marble Madness"
# JOTD's slave (v2.3, 20.03.2020); src/MarbleMadnessHD.s is identical to the source in his
# repository and to the one the whdload.de install package ships.
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves M/MarbleMadness/usr 6046174e263fa91456e213233e8d105de4e6efdb"

# MarbleMadness.slave runs the installed files; MarbleMadnessImage.slave (DISKIMAGE) is for
# an image of the cracked disk, which neither archive holds, so it is built but not booted.
VARIANTS="MarbleMadness MarbleMadnessImage"
SOURCE=src/MarbleMadnessHD.s
case "$VARIANT" in
  MarbleMadness) GAME_DIR=MarbleMadness SLAVE_FILE=MarbleMadness.slave ;;
  MarbleMadnessImage) GAME_DIR=MarbleMadness SLAVE_FILE=MarbleMadnessImage.slave DEFINES="-DDISKIMAGE" ;;
esac

# kick13: 512 KB chip and 256 KB fast (ws_ExpMem); an A500 with 512 KB chip and 512 KB slow.
KICKS="kick34005.A500"
SETUP=a500-1.5m
SETUPS="a500-1.5m a1200 a1200-030"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0=mouse
JOY1=keyboard
