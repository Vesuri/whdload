# Road Rash: common/template/game.conf describes every value.
TITLE="Road Rash"
AUTHOR="JOTD"
UPSTREAM="https://github.com/jotd666/whdload_slaves R/RoadRash/usr ce5a2a25"

# One slave: src/RoadRashHD.s, installed as RoadRash.slave in the version 2.0 (SPS 1313)
# drawer that make unpack extracts to tmp/game/RoadRash/. CUSTOM2=1 selects Enhanced
# framerate. The release source has no VERIFY instrumentation (docs/development.md).
VARIANTS="RoadRash"
SLAVE_FILE=RoadRash.slave
SOURCE=src/RoadRashHD.s
VASM_FLAGS="-devpac -nosym -Fhunkexe -pic"
# The slave is built against the NDK 3.2 includes, not the toolchain's.
NDK="${NDK:-${AMIGA_SHARE:-$HOME/.local/share/amiga}/ndk/Include_I}"

# A direct slave (no kickemu). BaseMem is $100000: the game wants 1 MB of chip RAM, so the
# shared a500 and a500-1.5m have too little.
KICKS=""
# a1200-fast (68EC020, 2 MB chip, 8 MB fast) holds all data with PRELOAD and takes Enhanced
# framerate's Fast RAM path. custom is the 68000 A500 with 1 MB chip and 1.5 MB slow RAM,
# where Enhanced framerate keeps the original path.
SETUP=a1200-fast
SETUPS="a1200-fast custom a1200 a1200-030 a1200-040 a1200-060"
AMIGA_MODEL=A500
CPU=68000
CHIP_KB=1024
FAST_KB=0
SLOW_KB=1536
KICKSTART="${AMIGA_SHARE:-$HOME/.local/share/amiga}/Kickstarts/kick40063.A600"
WHD_DEFAULTS="PRELOAD SPLASHDELAY=0 NOREQ"
JOY0="${JOY0:-mouse}"
JOY1="${JOY1:-keyboard}"
WINDOW_WIDTH=760
WINDOW_HEIGHT=568
